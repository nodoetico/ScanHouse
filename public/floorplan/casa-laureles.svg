<svg width="800" height="600" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="floorplanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050508;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:1" />
    </linearGradient>
    <pattern id="gridPattern" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M 5 0 L 0 0 0 5" fill="none" stroke="#ffffff" stroke-width="0.2" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#floorplanBg)"/>
  <rect width="100" height="100" fill="url(#gridPattern)"/>
  
  <!-- External walls -->
  <rect x="10" y="10" width="80" height="80" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2" rx="2"/>
  
  <!-- Internal walls -->
  <line x1="10" y1="45" x2="50" y2="45" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="3,3"/>
  <line x1="50" y1="10" x2="50" y2="45" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="3,3"/>
  <line x1="50" y1="55" x2="50" y2="90" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="3,3"/>
  <line x1="65" y1="45" x2="90" y2="45" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="3,3"/>
  
  <!-- Room labels -->
  <text x="30" y="30" font-family="'JetBrains Mono', monospace" font-size="5" font-weight="300" fill="#ffffff" fill-opacity="0.4" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.05em">SALÓN</text>
  <text x="70" y="30" font-family="'JetBrains Mono', monospace" font-size="5" font-weight="300" fill="#ffffff" fill-opacity="0.4" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.05em">COCINA</text>
  <text x="30" y="70" font-family="'JetBrains Mono', monospace" font-size="5" font-weight="300" fill="#ffffff" fill-opacity="0.4" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.05em">DORM. PRINCIPAL</text>
  <text x="70" y="70" font-family="'JetBrains Mono', monospace" font-size="5" font-weight="300" fill="#ffffff" fill-opacity="0.4" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.05em">DORM. 2</text>
  <text x="50" y="55" font-family="'JetBrains Mono', monospace" font-size="4" font-weight="300" fill="#ffffff" fill-opacity="0.4" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.05em">PASILLO</text>
  <text x="50" y="85" font-family="'JetBrains Mono', monospace" font-size="4" font-weight="300" fill="#ffffff" fill-opacity="0.4" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.05em">BAÑO</text>
  <text x="30" y="95" font-family="'JetBrains Mono', monospace" font-size="4" font-weight="300" fill="#ffffff" fill-opacity="0.4" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.05em">PATIO</text>
  <text x="70" y="95" font-family="'JetBrains Mono', monospace" font-size="4" font-weight="300" fill="#ffffff" fill-opacity="0.4" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.05em">COCHERA</text>
  
  <!-- Room highlights (interactive areas) -->
  <rect x="12" y="12" width="36" height="31" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1" rx="1"/>
  <rect x="52" y="12" width="36" height="31" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1" rx="1"/>
  <rect x="12" y="47" width="36" height="31" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1" rx="1"/>
  <rect x="52" y="47" width="36" height="31" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1" rx="1"/>
  <rect x="12" y="80" width="36" height="18" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1" rx="1"/>
  <rect x="52" y="80" width="36" height="18" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1" rx="1"/>
  
  <!-- Doors as small gaps -->
  <line x1="30" y1="45" x2="34" y2="45" stroke="#050508" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="30" x2="50" y2="34" stroke="#050508" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="55" x2="50" y2="59" stroke="#050508" stroke-width="3" stroke-linecap="round"/>
  <line x1="65" y1="45" x2="69" y2="45" stroke="#050508" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="75" x2="50" y2="79" stroke="#050508" stroke-width="3" stroke-linecap="round"/>
</svg>